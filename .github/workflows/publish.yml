name: QuerySaaS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Install QuerySaaS
        run: |
          python -m pip install -e ".[dev]"

      - name: Compile sources
        run: |
          python -m compileall src/querysaas tests examples

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Build distributions
        run: |
          python -m build

      - name: Validate distributions
        run: |
          python -m twine check dist/*

      - name: Verify FBDI registry in wheel
        shell: python
        run: |
          from pathlib import Path
          import zipfile

          wheel = next(
              Path("dist").glob("querysaas-*.whl")
          )

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()

          expected = "querysaas/data/fbdi_jobs.csv"

          if expected not in names:
              raise SystemExit(
                  f"Missing wheel resource: {expected}"
              )

          print(
              "Wheel contains FBDI registry:",
              expected,
          )
