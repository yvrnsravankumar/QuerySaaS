name: Publish QuerySaaS

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build QuerySaaS distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Install QuerySaaS
        run: |
          python -m pip install -e ".[dev]"

      - name: Compile sources
        run: |
          python -m compileall src/querysaas tests examples

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Build distributions
        run: |
          python -m build

      - name: Validate distributions
        run: |
          python -m twine check dist/*

      - name: Verify FBDI registry in wheel
        shell: python
        run: |
          from pathlib import Path
          import zipfile

          wheel = next(
              Path("dist").glob(
                  "querysaas-0.1.4-*.whl"
              )
          )

          expected = (
              "querysaas/data/fbdi_jobs.csv"
          )

          with zipfile.ZipFile(wheel) as archive:
              if expected not in archive.namelist():
                  raise SystemExit(
                      f"Missing resource: {expected}"
                  )

          print(
              "Wheel contains FBDI registry:",
              expected,
          )

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish QuerySaaS to PyPI
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/querysaas

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
