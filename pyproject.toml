[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querysaas"
version = "0.1.3"
description = "Query and synchronize enterprise SaaS applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sravan Yanamandra"}]
keywords = ["saas", "oracle-fusion", "bi-publisher", "duckdb", "etl", "salesforce"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "requests>=2.31",
  "pandas>=2.1",
  "lxml>=5.0",
  "duckdb>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "jupyterlab>=4"]

[project.urls]
Homepage = "https://github.com/yvrnsravankumar/QuerySaaS"
Repository = "https://github.com/yvrnsravankumar/QuerySaaS"
Issues = "https://github.com/yvrnsravankumar/QuerySaaS/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
